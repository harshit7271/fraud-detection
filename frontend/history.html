<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session History — FACEGUARD AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Persistent Sidebar -->
    <div id="sidebarContainer"></div>

    <!-- Main Content Container -->
    <div class="ml-64 flex flex-col min-h-screen">
        
        <!-- Header Bar -->
        <div id="headerContainer"></div>

        <!-- History Content Work Area -->
        <main class="flex-1 p-8 space-y-6 max-w-7xl">
            
            <!-- Filters & Search Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-white border border-slate-200 shadow-sm">
                
                <!-- Search Bar -->
                <div class="flex-1 min-w-[280px] relative">
                    <span class="absolute inset-y-0 left-3.5 flex items-center text-slate-400 text-sm">🔍</span>
                    <input id="sessionSearchInput" type="text" placeholder="Search by Candidate ID, Interview ID or UUID..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-xs font-mono text-slate-900 focus:outline-none focus:border-indigo-500 focus:bg-white transition">
                </div>

                <!-- Filter Controls -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                        <span class="text-slate-500 font-mono">Risk Level:</span>
                        <select id="riskFilterSelect" class="bg-transparent text-slate-800 font-medium focus:outline-none cursor-pointer">
                            <option value="ALL">All Levels</option>
                            <option value="LOW">Low Risk</option>
                            <option value="MEDIUM">Medium Risk</option>
                            <option value="HIGH">High Risk</option>
                            <option value="CRITICAL">Critical Risk</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
                        <span class="text-slate-500 font-mono">Status:</span>
                        <select id="statusFilterSelect" class="bg-transparent text-slate-800 font-medium focus:outline-none cursor-pointer">
                            <option value="ALL">All Statuses</option>
                            <option value="INITIALIZED">INITIALIZED</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>

                    <span id="totalSessionsBadge" class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-mono font-bold px-3 py-2 rounded-xl">
                        0 Sessions
                    </span>
                </div>

            </div>

            <!-- Sessions Data Table -->
            <div class="glass-card rounded-2xl overflow-hidden shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[11px] font-mono uppercase tracking-wider text-slate-500 bg-slate-50 border-b border-slate-200">
                                <th class="py-3.5 px-4 font-semibold">Session UUID</th>
                                <th class="py-3.5 px-4 font-semibold">Candidate ID</th>
                                <th class="py-3.5 px-4 font-semibold">Interview ID</th>
                                <th class="py-3.5 px-4 font-semibold">Tenant</th>
                                <th class="py-3.5 px-4 font-semibold">Status</th>
                                <th class="py-3.5 px-4 font-semibold">Risk Score</th>
                                <th class="py-3.5 px-4 font-semibold">Category</th>
                                <th class="py-3.5 px-4 font-semibold">Events</th>
                                <th class="py-3.5 px-4 font-semibold">Created At</th>
                                <th class="py-3.5 px-4 text-right font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Populated dynamically by history.js -->
                        </tbody>
                    </table>

                    <div id="historyEmptyState" class="py-16 text-center text-xs text-slate-400 space-y-2">
                        <p class="text-3xl">📭</p>
                        <p class="font-medium text-slate-600">No matching interview sessions found.</p>
                        <p class="text-slate-400">Try adjusting your search criteria or register a candidate.</p>
                    </div>
                </div>

                <!-- 10-Item Pagination Controls -->
                <div id="historyPagination" class="flex flex-wrap items-center justify-between gap-3 p-4 border-t border-slate-100 text-xs font-mono text-slate-500 hidden">
                    <div id="historyPageInfo">Showing 1 to 10 of 10 sessions</div>
                    <div class="flex items-center gap-1.5">
                        <button id="historyPrevBtn" type="button" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition shadow-xs flex items-center gap-1 cursor-pointer">
                            <span>←</span>
                            <span>Previous</span>
                        </button>
                        <span id="historyPageNumber" class="px-2.5 py-1 text-slate-700 font-bold">Page 1 of 1</span>
                        <button id="historyNextBtn" type="button" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition shadow-xs flex items-center gap-1 cursor-pointer">
                            <span>Next</span>
                            <span>→</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ES6 Module Script -->
    <script type="module" src="/static/js/history.js"></script>
</body>
</html>
