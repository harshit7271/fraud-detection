<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Session History — FACEGUARD AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', system-ui, 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#1f1f23',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-[#eaedf0] text-zinc-900 min-h-screen selection:bg-zinc-200">

    <!-- Persistent Sidebar -->
    <div id="sidebarContainer"></div>

    <!-- Main Content Container (Responsive margin for sidebar) -->
    <div class="lg:ml-64 flex flex-col min-h-screen transition-all duration-300 min-w-0">
        
        <!-- Header Bar -->
        <div id="headerContainer"></div>

        <!-- History Content Work Area -->
        <main class="flex-1 p-3.5 sm:p-6 lg:p-8 space-y-5 sm:space-y-6 max-w-7xl w-full min-w-0">
            
            <!-- Filters & Search Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-2xl bg-white border border-zinc-200 shadow-xs">
                
                <!-- Search Bar -->
                <div class="flex-1 min-w-[240px] w-full sm:w-auto relative">
                    <span class="absolute inset-y-0 left-3.5 flex items-center text-zinc-400 text-sm">🔍</span>
                    <input id="sessionSearchInput" type="text" placeholder="Search Candidate ID, Interview ID or UUID..." class="w-full bg-zinc-50 border border-zinc-200 rounded-xl pl-10 pr-4 py-2.5 text-xs font-mono text-zinc-900 focus:outline-none focus:border-zinc-400 focus:bg-white transition min-h-[42px]">
                </div>

                <!-- Filter Controls -->
                <div class="flex flex-wrap items-center gap-2.5 w-full sm:w-auto">
                    <div class="flex items-center gap-2 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2 text-xs flex-1 sm:flex-initial min-h-[42px]">
                        <span class="text-zinc-500 font-mono">Risk:</span>
                        <select id="riskFilterSelect" class="bg-transparent text-zinc-900 font-medium focus:outline-none cursor-pointer text-xs w-full sm:w-auto">
                            <option value="ALL">All Levels</option>
                            <option value="LOW">Low Risk</option>
                            <option value="MEDIUM">Medium Risk</option>
                            <option value="HIGH">High Risk</option>
                            <option value="CRITICAL">Critical Risk</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-2 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2 text-xs flex-1 sm:flex-initial min-h-[42px]">
                        <span class="text-zinc-500 font-mono">Status:</span>
                        <select id="statusFilterSelect" class="bg-transparent text-zinc-900 font-medium focus:outline-none cursor-pointer text-xs w-full sm:w-auto">
                            <option value="ALL">All Statuses</option>
                            <option value="INITIALIZED">INITIALIZED</option>
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>

                    <span id="totalSessionsBadge" class="bg-zinc-100 text-zinc-900 border border-zinc-200 text-xs font-mono font-bold px-3 py-2 rounded-xl flex items-center justify-center min-h-[42px]">
                        0 Sessions
                    </span>
                </div>

            </div>

            <!-- Sessions Data Table -->
            <div class="glass-card rounded-2xl overflow-hidden shadow-xs">
                <div class="overflow-x-auto touch-scroll">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[11px] font-mono uppercase tracking-wider text-zinc-500 bg-zinc-50 border-b border-zinc-200">
                                <th class="py-3.5 px-4 font-semibold">Session UUID</th>
                                <th class="py-3.5 px-4 font-semibold">Candidate ID</th>
                                <th class="py-3.5 px-4 font-semibold">Interview ID</th>
                                <th class="py-3.5 px-4 font-semibold">Status</th>
                                <th class="py-3.5 px-4 font-semibold">Risk Score</th>
                                <th class="py-3.5 px-4 font-semibold">Created Timestamp</th>
                                <th class="py-3.5 px-4 text-right font-semibold">Forensic Action</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Injected by history.js -->
                        </tbody>
                    </table>

                    <div id="historyEmptyState" class="py-16 text-center text-xs text-zinc-400 space-y-2 hidden">
                        <p class="text-2xl">📋</p>
                        <p class="font-medium text-zinc-600">No matching proctoring sessions found.</p>
                        <p class="text-zinc-400">Try adjusting your filters or register a candidate to start monitoring.</p>
                    </div>
                </div>

                <!-- 10-Item Pagination Controls -->
                <div id="historyPagination" class="flex flex-wrap items-center justify-between gap-3 p-4 border-t border-zinc-100 text-xs font-mono text-zinc-500">
                    <div id="historyPageInfo">Showing 1 to 10 of 10 sessions</div>
                    <div class="flex items-center gap-1.5">
                        <button id="historyPrevBtn" type="button" class="px-3 py-1.5 rounded-lg border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-700 font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition shadow-2xs flex items-center gap-1 cursor-pointer">
                            <span>←</span>
                            <span>Previous</span>
                        </button>
                        <span id="historyPageNumber" class="px-2.5 py-1 text-zinc-900 font-bold">Page 1 of 1</span>
                        <button id="historyNextBtn" type="button" class="px-3 py-1.5 rounded-lg border border-zinc-200 bg-white hover:bg-zinc-50 text-zinc-700 font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition shadow-2xs flex items-center gap-1 cursor-pointer">
                            <span>Next</span>
                            <span>→</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- ES6 Module Script -->
    <script type="module" src="/static/js/history.js?v=3.0.0"></script>
</body>
</html>
